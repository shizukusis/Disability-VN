<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- フルスクリーン: iPhoneは「ホーム画面に追加」で全画面(standalone)。Android/PCはFullscreen API -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ディザビリティ">
<meta name="theme-color" content="#0a0712">
<!-- OGP / Twitter(X)カード: SNSで共有した時にタイトル画面のプレビューを表示する -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="最弱無才のディザビリティ Fan Visual Novel">
<meta property="og:title" content="最弱無才のディザビリティ ～才能ゼロの転生者～">
<meta property="og:description" content="雫氏のWeb小説『最弱無才のディザビリティ』をブラウザで遊べるビジュアルノベルにした二次創作です。">
<meta property="og:url" content="https://shizukusis.github.io/Disability-VN/">
<meta property="og:image" content="https://shizukusis.github.io/Disability-VN/assets/ui/ogp.jpg">
<meta property="og:image:secure_url" content="https://shizukusis.github.io/Disability-VN/assets/ui/ogp.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="最弱無才のディザビリティ タイトル画面">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="最弱無才のディザビリティ ～才能ゼロの転生者～">
<meta name="twitter:description" content="雫氏のWeb小説『最弱無才のディザビリティ』をブラウザで遊べるビジュアルノベルにした二次創作です。">
<meta name="twitter:image" content="https://shizukusis.github.io/Disability-VN/assets/ui/ogp.jpg">
<meta name="twitter:image:alt" content="最弱無才のディザビリティ タイトル画面">
<title>最弱無才のディザビリティ ～才能ゼロの転生者～</title>
<link rel="icon" type="image/png" href="assets/ui/favicon.png">
<link rel="stylesheet" href="css/style.css?v=17d9947">
</head>
<body>

<div id="game">
  <!-- ===== 起動ゲート(初回タップで音声解放) ===== -->
  <div id="boot-gate">
    <div class="boot-inner">
      <div class="boot-title">最弱無才のディザビリティ</div>
      <div class="boot-prompt">画面をタップして始める</div>
      <div class="boot-load"><div class="boot-load-bar"></div></div>
      <div class="boot-load-text">読み込み中…</div>
    </div>
  </div>

  <!-- ===== タイトル画面 ===== -->
  <div id="title-screen" class="screen">
    <div class="title-bg"></div>
    <div class="title-logo">
      <img class="title-logo-img" src="assets/ui/logo.png" alt="最弱無才のディザビリティ ～才能ゼロの転生者～">
      <span class="title-original">原作: 雫『最弱無才のディザビリティ』</span>
    </div>
    <nav class="title-menu">
      <button id="btn-newgame" class="title-btn">はじめから</button>
      <button id="btn-continue" class="title-btn">つづきから</button>
      <button id="btn-chapter" class="title-btn">チャプター選択</button>
      <button id="btn-endings" class="title-btn">エンディングリスト</button>
      <button id="btn-gallery" class="title-btn">ギャラリー</button>
      <button id="btn-config-title" class="title-btn">設定</button>
      <button id="btn-fs-title" class="title-btn" hidden>全画面表示</button>
      <button id="btn-original" class="title-btn title-btn-original">原作小説を読む ↗</button>
      <button id="btn-quit" class="title-btn title-btn-quit">ゲーム終了</button>
    </nav>
    <div class="title-version">Fan Visual Novel ver 0.1</div>
  </div>

  <!-- ===== ゲーム本編 ===== -->
  <div id="play-screen" class="screen hidden">
    <div id="bg-layer"></div>
    <div id="bg-layer-front"></div>
    <div id="chara-layer"></div>
    <div id="effect-layer"></div>
    <div id="cg-layer"></div>
    <div id="scene-dimmer"></div>

    <!-- 視点インジケータ(ヤマト以外のSide Story中に常時表示・話者色でテーマ化) -->
    <div id="pov-frame"></div>
    <div id="pov-indicator">
      <span class="pov-bar"></span>
      <span id="pov-name" class="pov-name"></span>
      <span class="pov-side">SIDE</span>
    </div>

    <!-- メッセージウィンドウ -->
    <div id="message-window">
      <div id="name-plate" class="hidden"><span id="name-text"></span></div>
      <div id="message-text"></div>
      <div id="advance-icon">▼</div>
    </div>

    <!-- 選択肢 -->
    <div id="choice-layer" class="hidden"></div>

    <!-- 操作パネル -->
    <div id="control-bar">
      <button data-ctl="auto" title="オート">AUTO</button>
      <button data-ctl="skip" title="スキップ">SKIP</button>
      <button data-ctl="log" title="バックログ">LOG</button>
      <button data-ctl="save" title="セーブ">SAVE</button>
      <button data-ctl="load" title="ロード">LOAD</button>
      <button data-ctl="config" title="設定">CONFIG</button>
      <button data-ctl="fs" title="全画面" hidden>⛶</button>
      <button data-ctl="hide" title="ウィンドウ非表示">▢</button>
      <button data-ctl="title" title="タイトルへ">TITLE</button>
    </div>

    <!-- 章タイトル表示 -->
    <div id="chapter-card" class="hidden">
      <div id="chapter-card-no"></div>
      <div id="chapter-card-title"></div>
    </div>

    <!-- エンディングカード -->
    <div id="ending-card" class="hidden">
      <div id="ending-card-type"></div>
      <div id="ending-card-title"></div>
      <button id="ending-card-back">タイトルへ戻る</button>
    </div>
  </div>

  <!-- ===== オーバーレイ(ログ/セーブ/設定/チャプター/エンディング) ===== -->
  <div id="overlay" class="hidden">
    <div id="overlay-panel">
      <div id="overlay-header">
        <span id="overlay-title"></span>
        <button id="overlay-close">×</button>
      </div>
      <div id="overlay-body"></div>
    </div>
  </div>

  <!-- 画面遷移フェード -->
  <div id="fader"></div>
</div>

<!-- スマホ縦持ち時の回転案内 -->
<div id="rotate-hint"><div class="rotate-icon">⟳</div>端末を横向きにしてください</div>

<!-- キャラクター定義 / シナリオ(編集はこれらのファイルを) -->
<script src="js/characters.js?v=17d9947"></script>
<script src="js/scenes.js?v=17d9947"></script>
<script src="scenario/ch01.js?v=17d9947"></script>
<script src="scenario/ch02.js?v=17d9947"></script>
<script src="scenario/ch03.js?v=17d9947"></script>
<script src="scenario/ch04.js?v=17d9947"></script>
<script src="scenario/ch05.js?v=17d9947"></script>
<script src="scenario/ch06.js?v=17d9947"></script>
<script src="scenario/ch07.js?v=17d9947"></script>
<script src="scenario/ch08.js?v=17d9947"></script>
<script src="scenario/ending.js?v=17d9947"></script>
<script src="scenario/overrides.js?v=17d9947"></script>
<script src="js/engine.js?v=17d9947"></script>
</body>
</html>
